<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cafe Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <header>
      <h1>☕ Cafe Finder</h1>
      <p class="sub">Live cafes near you, powered by Google Maps</p>
    </header>

    <section class="filters">
      <label>
        Radius: <strong id="radiusLabel">1.5 km</strong>
        <input type="range" id="radius" min="500" max="5000" step="250" value="1500" />
      </label>

      <div class="row">
        <label class="check"><input type="checkbox" id="openNow" /> Open now</label>
        <label>
          Min rating
          <select id="minRating">
            <option value="0">Any</option>
            <option value="3.5">3.5+</option>
            <option value="4">4.0+</option>
            <option value="4.5">4.5+</option>
          </select>
        </label>
        <label>
          Sort
          <select id="sortBy">
            <option value="rating">Rating</option>
            <option value="reviews">Most reviewed</option>
            <option value="distance">Distance</option>
          </select>
        </label>
      </div>

      <div class="row">
        <button id="locateBtn">📍 Use my location</button>
        <button id="searchAreaBtn" class="secondary">Search this area</button>
      </div>
      <label class="check"><input type="checkbox" id="favOnly" /> Show favorites only ❤️</label>
    </section>

    <div id="status" class="status" role="status"></div>
    <ul id="results" class="results"></ul>
  </aside>

  <main id="map" aria-label="Map of cafes"></main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
